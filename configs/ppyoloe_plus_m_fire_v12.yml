# PP-YOLOE+_m 416x416, 300 epoch - v12.0 rev2
# Model: PP-YOLOE+_m (depth=0.67, width=0.75, ~23M params, Obj365 pretrained)
# Key changes from v12-rev1 (failed PP-YOLOE+_l):
#   - Downgraded from _l (depth=1.0, 204MB) to _m (depth=0.67, 87MB, 3x faster)
#   - NO board copy-paste (caused conflict with Mosaic)
#   - Pure original train.json (no augmented data noise)
#   - v11-verified Mosaic+Mixup+GridMask recipe
#   - 300 epochs for full convergence
#
# Usage: python train.py

_BASE_: [
  '../PaddleDetection/configs/datasets/coco_detection.yml',
  '../PaddleDetection/configs/runtime.yml',
  '../PaddleDetection/configs/ppyoloe/_base_/ppyoloe_plus_crn.yml',
]

# ======== Dataset ========
metric: COCO
num_classes: 3

TrainDataset:
  name: COCODataSet
  image_dir: A_train/Image
  anno_path: A_train/train.json
  dataset_dir: .
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']
  allow_empty: true

EvalDataset:
  name: COCODataSet
  image_dir: A_train/Image
  anno_path: A_train/val.json
  dataset_dir: .
  allow_empty: true

TestDataset:
  name: ImageFolder
  anno_path: A_train/val.json
  dataset_dir: .

# ======== Model: PP-YOLOE+_m (depth=0.67, width=0.75) ========
pretrain_weights: https://bj.bcebos.com/v1/paddledet/models/pretrained/ppyoloe_crn_m_obj365_pretrained.pdparams
weights: output/ppyoloe_plus_m_fire_v12/model_final
find_unused_parameters: True
use_ema: true
epoch: 300
snapshot_epoch: 15

depth_mult: 0.67
width_mult: 0.75

# NMS for fire detection (3 classes)
PPYOLOEHead:
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 100
    score_threshold: 0.025
    nms_threshold: 0.6

# ======== Learning rate for 300 epochs ========
# base_lr=0.001 for 8-GPU bs=8. Single GPU bs=6: scale proportionally
LearningRate:
  base_lr: 0.00075
  schedulers:
    - name: CosineDecay
      max_epochs: 300
    - name: LinearWarmup
      start_factor: 0.0
      steps: 500

OptimizerBuilder:
  optimizer:
    momentum: 0.9
    type: Momentum
  regularizer:
    factor: 0.0005
    type: L2

# ======== Reader: v11-verified Mosaic+Mixup+GridMask at 416x416 ========
# PP-YOLOE+ uses norm_type: none (mean=[0,0,0], std=[1,1,1])
# Mosaic disabled at epoch 200 to avoid late-stage feature confusion
worker_num: 2
eval_height: &eval_height 416
eval_width: &eval_width 416
eval_size: &eval_size [*eval_height, *eval_width]

TrainReader:
  sample_transforms:
    - Decode: {}
    - Mosaic:
        prob: 0.5
        input_dim: [416, 416]
        degrees: [-10, 10]
        translate: [-0.1, 0.1]
        scale: [0.5, 1.5]
        shear: [-2, 2]
        enable_mixup: true
        mixup_prob: 0.5
        mixup_scale: [0.5, 1.5]
    - RandomCrop: {}
    - RandomFlip: {prob: 0.5}
    - RandomDistort: {}
    - GridMask: {prob: 0.3, ratio: 0.5, use_h: true, use_w: true, rotate: 1, offset: false, mode: 1, upper_iter: 360000}
  batch_transforms:
    - BatchRandomResize: {target_size: [320, 352, 384, 416, 448, 480, 512, 544, 576], random_size: True, random_interp: True, keep_ratio: False}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
    - PadGT: {}
  batch_size: 8
  shuffle: true
  drop_last: true
  use_shared_memory: true
  mosaic_epoch: 200

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: *eval_size, keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 8

TestReader:
  inputs_def:
    image_shape: [1, 3, *eval_height, *eval_width]
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: *eval_size, keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 1
