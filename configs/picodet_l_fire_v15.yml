# PicoDet-L training config for Fire Detection Competition - v15.0
# 3 classes: battery, board, fire
# Model upgrade: PicoDet-M (LCNet 1.5x, 3.46M) --> PicoDet-L (LCNet 2.0x, ~5.8M)
# Uses V13's winning recipe (original annotations + manual fixes)
# GridMask + multi-scale 320~576, 200 epochs, EMA

_BASE_: [
  '../PaddleDetection/configs/datasets/coco_detection.yml',
  '../PaddleDetection/configs/runtime.yml',
  '../PaddleDetection/configs/picodet/_base_/picodet_v2.yml',
  '../PaddleDetection/configs/picodet/_base_/optimizer_300e.yml',
]

# ======== Dataset ========
metric: COCO
num_classes: 3

TrainDataset:
  name: COCODataSet
  image_dir: A_train/Image
  anno_path: A_train/train.json
  dataset_dir: .
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']
  allow_empty: true

EvalDataset:
  name: COCODataSet
  image_dir: A_train/Image
  anno_path: A_train/val.json
  dataset_dir: .
  allow_empty: true

TestDataset:
  name: ImageFolder
  anno_path: A_train/val.json
  dataset_dir: .

# ======== Model: PicoDet-L (LCNet 2.0x, LCPAN 160ch, PicoFeat 160ch 4convs) ========
# COCO-pretrained PicoDet-L for better initialization
pretrain_weights: https://paddledet.bj.bcebos.com/models/picodet_l_320_coco_lcnet.pdparams
weights: output/picodet_l_fire_v15/model_final
find_unused_parameters: True
use_ema: true
epoch: 200
snapshot_epoch: 10

# PicoDet-L overrides (wider backbone, neck, head)
LCNet:
  scale: 2.0
  feature_maps: [3, 4, 5]

LCPAN:
  out_channels: 160

PicoHeadV2:
  conv_feat:
    name: PicoFeat
    feat_in: 160
    feat_out: 160
    num_convs: 4
    num_fpn_stride: 4
    norm_type: bn
    share_cls_reg: True
    use_se: True
  feat_in_chan: 160
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 100
    score_threshold: 0.025
    nms_threshold: 0.6

# ======== Learning rate (scaled for batch_size=8) ========
# PicoDet-L default: base_lr=0.12 @ bs=24 -> per-sample 0.005
# Our batch_size=8: 0.005 * 8 = 0.04
LearningRate:
  base_lr: 0.04
  schedulers:
    - name: CosineDecay
      max_epochs: 200
    - name: LinearWarmup
      start_factor: 0.1
      steps: 500

# ======== Reader: 416x416, wide multi-scale + GridMask (V13 recipe) ========
worker_num: 2

TrainReader:
  sample_transforms:
    - Decode: {}
    - RandomCrop: {}
    - RandomFlip: {prob: 0.5}
    - RandomDistort: {}
    - GridMask: {prob: 0.3, ratio: 0.5, use_h: true, use_w: true, rotate: 1, offset: false, mode: 1, upper_iter: 360000}
  batch_transforms:
    - BatchRandomResize: {target_size: [320, 352, 384, 416, 448, 480, 512, 544, 576], random_size: True, random_interp: True, keep_ratio: False}
    - NormalizeImage: {is_scale: true, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    - Permute: {}
    - PadGT: {}
  batch_size: 8
  shuffle: true
  drop_last: true
  use_shared_memory: true

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {interp: 2, target_size: [416, 416], keep_ratio: False}
    - NormalizeImage: {is_scale: true, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    - Permute: {}
  batch_size: 8

TestReader:
  inputs_def:
    image_shape: [1, 3, 416, 416]
  sample_transforms:
    - Decode: {}
    - Resize: {interp: 2, target_size: [416, 416], keep_ratio: False}
    - NormalizeImage: {is_scale: true, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    - Permute: {}
  batch_size: 1
