# PP-YOLOE+_l Stage 2: VR-only finetune - v12.0
# Loads Stage 1 best_model, fine-tunes on pure VR data for battery/board precision.
#
# Usage: python train.py --config configs/ppyoloe_plus_l_fire_v12_stage2.yml

_BASE_: [
  '../PaddleDetection/configs/datasets/coco_detection.yml',
  '../PaddleDetection/configs/runtime.yml',
  '../PaddleDetection/configs/ppyoloe/_base_/ppyoloe_plus_crn.yml',
]

# ======== Dataset: Pure VR data (no external) ========
metric: COCO
num_classes: 3

TrainDataset:
  name: COCODataSet
  image_dir: A_train/Image
  anno_path: A_train/train.json
  dataset_dir: .
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']
  allow_empty: true

EvalDataset:
  name: COCODataSet
  image_dir: A_train/Image
  anno_path: A_train/val.json
  dataset_dir: .
  allow_empty: true

TestDataset:
  name: ImageFolder
  anno_path: A_train/val.json
  dataset_dir: .

# ======== Model: PP-YOLOE+_l ========
pretrain_weights: output/best_model.pdparams
weights: output/ppyoloe_plus_l_fire_v12_stage2/model_final
find_unused_parameters: True
use_ema: true
epoch: 100
snapshot_epoch: 10

depth_mult: 1.0
width_mult: 1.0

PPYOLOEHead:
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 100
    score_threshold: 0.025
    nms_threshold: 0.6

# ======== Learning rate: low LR for fine-tuning ========
LearningRate:
  base_lr: 0.0001
  schedulers:
    - name: CosineDecay
      max_epochs: 100
    - name: LinearWarmup
      start_factor: 0.0
      steps: 200

OptimizerBuilder:
  optimizer:
    momentum: 0.9
    type: Momentum
  regularizer:
    factor: 0.0005
    type: L2

# ======== Reader: Milder augmentations for fine-tuning ========
worker_num: 2
eval_height: &eval_height 416
eval_width: &eval_width 416
eval_size: &eval_size [*eval_height, *eval_width]

TrainReader:
  sample_transforms:
    - Decode: {}
    - RandomDistort: {}
    - RandomExpand: {fill_value: [123.675, 116.28, 103.53]}
    - RandomCrop: {}
    - RandomFlip: {}
  batch_transforms:
    - BatchRandomResize: {target_size: [352, 384, 416, 448, 480], random_size: True, random_interp: True, keep_ratio: False}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
    - PadGT: {}
  batch_size: 4
  shuffle: true
  drop_last: true
  use_shared_memory: true

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: *eval_size, keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 8

TestReader:
  inputs_def:
    image_shape: [1, 3, *eval_height, *eval_width]
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: *eval_size, keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 1
