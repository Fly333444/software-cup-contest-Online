# PicoDet-M v11 training config for Fire Detection Competition
# 3 classes: battery, board, fire
# v11 strategy: stronger augmentation + longer training + EMA + optimizer tuning
# Key changes from v9:
#   - Mosaic + Mixup for better generalization
#   - 300 epoch with cosine warm restart
#   - Adjusted EMA decay
#   - Label smoothing to prevent overfitting on small dataset

_BASE_: [
  '../PaddleDetection/configs/datasets/coco_detection.yml',
  '../PaddleDetection/configs/runtime.yml',
  '../PaddleDetection/configs/picodet/_base_/picodet_v2.yml',
  '../PaddleDetection/configs/picodet/_base_/optimizer_300e.yml',
]

# ======== Dataset ========
metric: COCO
num_classes: 3

TrainDataset:
  name: COCODataSet
  image_dir: A_train/Image
  anno_path: A_train/train.json
  dataset_dir: .
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']
  allow_empty: true

EvalDataset:
  name: COCODataSet
  image_dir: A_train/Image
  anno_path: A_train/val.json
  dataset_dir: .
  allow_empty: true

TestDataset:
  name: ImageFolder
  anno_path: A_train/val.json
  dataset_dir: .

# ======== Model: PicoDet-M ========
pretrain_weights: https://paddledet.bj.bcebos.com/models/picodet_m_320_coco_lcnet.pdparams
weights: output/picodet_m_fire_v11/model_final
find_unused_parameters: True
use_ema: true
epoch: 300
snapshot_epoch: 15

# EMA with higher decay for small dataset stability
ema:
  decay: 0.9998
  ema_decay_type: threshold
  cycle_epoch: -1

PicoHeadV2:
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 100
    score_threshold: 0.025
    nms_threshold: 0.6

# ======== Learning rate ========
# Base LR 0.04 (same as v9 tested recipe, scaled for bs=8)
LearningRate:
  base_lr: 0.04
  schedulers:
    - name: CosineDecay
      max_epochs: 300
    - name: LinearWarmup
      start_factor: 0.1
      steps: 500

OptimizerBuilder:
  optimizer:
    momentum: 0.9
    type: Momentum
  regularizer:
    factor: 0.00004
    type: L2

# ======== Reader: stronger augmentation for generalization ========
worker_num: 2

TrainReader:
  sample_transforms:
    - Decode: {}
    - Mosaic:
        prob: 0.5
        input_dim: [416, 416]
        degrees: [-10, 10]
        translate: [-0.1, 0.1]
        scale: [0.5, 1.5]
        shear: [-2, 2]
        enable_mixup: true
        mixup_prob: 0.5
        mixup_scale: [0.5, 1.5]
    - RandomCrop: {}
    - RandomFlip: {prob: 0.5}
    - RandomDistort: {}
    - GridMask: {prob: 0.3, ratio: 0.5, use_h: true, use_w: true, rotate: 1, offset: false, mode: 1, upper_iter: 360000}
  batch_transforms:
    - BatchRandomResize: {target_size: [320, 352, 384, 416, 448, 480, 512, 544, 576], random_size: True, random_interp: True, keep_ratio: False}
    - NormalizeImage: {is_scale: true, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    - Permute: {}
    - PadGT: {}
  batch_size: 8
  shuffle: true
  drop_last: true
  use_shared_memory: true
  mosaic_epoch: 200

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {interp: 2, target_size: [416, 416], keep_ratio: False}
    - NormalizeImage: {is_scale: true, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    - Permute: {}
  batch_size: 8

TestReader:
  inputs_def:
    image_shape: [1, 3, 416, 416]
  sample_transforms:
    - Decode: {}
    - Resize: {interp: 2, target_size: [416, 416], keep_ratio: False}
    - NormalizeImage: {is_scale: true, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    - Permute: {}
  batch_size: 1
